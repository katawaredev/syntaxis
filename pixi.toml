[workspace]
name = "syntaxis-dev"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Native Rust build scripts need a C linker, while the web build's small C
# compatibility shim needs Clang's wasm32 support. Pixi supplies both without
# requiring root access in the development container.
[dependencies]
c-compiler = "*"
clang = "*"

[activation]
scripts = ["scripts/activate-pixi-toolchain.sh"]

[tasks]
qa = "just qa"
qa-server = "just qa server"
serve = "just serve"
