pre-commit:
  commands:
    check:
      glob:
        - "**/*.rs"
        - "Cargo.toml"
        - "**/Cargo.toml"
        - "Cargo.lock"
        - "clippy.toml"
        - "Dioxus.toml"
        - "assets/**"
      run: >-
        if command -v just >/dev/null 2>&1 && command -v cc >/dev/null 2>&1;
        then just pre-commit;
        else mise run pre-commit;
        fi
      skip:
        - merge
        - rebase
