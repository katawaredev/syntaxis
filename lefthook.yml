pre-commit:
  commands:
    check:
      glob:
        - "**/*.rs"
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.cjs"
        - "**/*.css"
        - "**/*.json"
        - "**/*.jsonc"
        - "Cargo.toml"
        - "**/Cargo.toml"
        - "Cargo.lock"
        - "bun.lock"
        - "clippy.toml"
        - "Dioxus.toml"
        - "Justfile"
        - "lefthook.yml"
      run: >-
        if command -v just >/dev/null 2>&1 && command -v cc >/dev/null 2>&1;
        then just pre-commit;
        else mise run pre-commit;
        fi
      skip:
        - merge
        - rebase
