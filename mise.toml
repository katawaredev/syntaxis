[tools]
rust = { version = "stable", profile = "minimal", components = [
  "clippy",
  "rust-analyzer",
  "rust-src",
  "rustfmt",
], targets = [
  "wasm32-unknown-unknown",
] }
node = "26"
bun = "1.3.14"
just = "1.58.0"
lefthook = "2.1.10"
taplo = "latest"
cargo-binstall = "1.21.1"
"cargo:dioxus-cli" = "0.7.10"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-expand" = "1.0.124"
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"

[tasks.setup]
description = "Install locked JavaScript dependencies and Git hooks"
run = ["bun install --frozen-lockfile", "lefthook install"]

[tasks.pre-commit]
description = "Refresh generated assets and check formatting"
run = "just pre-commit"

[tasks.check]
description = "Validate the default web build without modifying files"
run = "just check web"

[tasks."check:server"]
description = "Validate the server build without modifying files"
run = "just check server"

[tasks.ci]
description = "Run the complete, manually requested quality audit"
run = "just ci web && just check server"

[tasks.qa]
description = "Auto-fix and validate the default web build"
run = "just qa"

[tasks."qa:server"]
description = "Auto-fix and validate the server build"
run = "just qa server"

[tasks.serve]
description = "Start the default development server"
run = "just serve"
