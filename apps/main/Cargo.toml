[package]
name = "syntaxis"
version = "0.11.2"
authors = ["Nikolay Stoynov <arvigeus@gmail.com>"]
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "ws"], optional = true }
base64 = "0.23.1"
bytes = "1.12.1"
csv = "1.4.0"
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
dioxus-code-editor = { path = "../../crates/code-editor" }
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955" }
dioxus-sdk-time = "0.7.0"
futures-util = "0.3.34"
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
  "html",
] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.4", optional = true }
syntaxis-agent = { path = "../../crates/agent" }
syntaxis-agent-host = { path = "../../crates/agent-host", optional = true }
syntaxis-app-contracts = { path = "../../crates/app-contracts" }
syntaxis-app-shell = { path = "../../crates/app-shell" }
syntaxis-module-files = { path = "../../crates/module-files" }
syntaxis-module-git = { path = "../../crates/module-git" }
syntaxis-module-terminal = { path = "../../crates/module-terminal" }
syntaxis-ui = { path = "../../crates/ui" }
syntaxis-editor = { path = "../../crates/editor" }
syntaxis-git = { path = "../../crates/git" }
syntaxis-git-host = { path = "../../crates/git-host", optional = true }
syntaxis-lsp-host = { path = "../../crates/lsp-host", optional = true }
syntaxis-notifications = { path = "../../crates/notifications" }
syntaxis-notifications-host = { path = "../../crates/notifications-host", optional = true }
syntaxis-runtime-main = { path = "../../crates/runtime-main" }
syntaxis-terminal = { path = "../../crates/terminal" }
syntaxis-workspace = { path = "../../crates/workspace" }
syntaxis-workspace-host = { path = "../../crates/workspace-host", optional = true }
syntaxis-terminal-host = { path = "../../crates/terminal-host", optional = true }
web-time = "1.1.0"
url = "2.5.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4.0", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = { version = "0.5.3", optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
], optional = true }
rpassword = { version = "7.5.4", optional = true }
subtle = { version = "2.6.1", optional = true }
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
], optional = true }
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-webpki-roots",
], optional = true }
tokio-util = { version = "0.7.19", features = ["rt"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
cc = "1.4.3"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = [
  "dioxus/desktop",
  "dep:syntaxis-workspace-host",
  "dep:tokio",
  "syntaxis-runtime-main/host",
]
mobile = ["dioxus/mobile"]
server = [
  "dioxus/server",
  "dep:axum",
  "dep:argon2",
  "dep:rand_core",
  "dep:toml",
  "dep:syntaxis-agent-host",
  "dep:syntaxis-git-host",
  "dep:syntaxis-lsp-host",
  "dep:syntaxis-notifications-host",
  "dep:syntaxis-terminal-host",
  "dep:syntaxis-workspace-host",
  "dep:reqwest",
  "dep:rpassword",
  "dep:subtle",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:tokio-util",
]

[lints]
workspace = true
