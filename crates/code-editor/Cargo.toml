[package]
name = "dioxus-code-editor"
version = "0.1.4-syntaxis.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["lib"] }
serde = { version = "1.0.229", features = ["derive"] }
similar = { version = "3.1.2", features = ["inline", "wasm32_web_time"] }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
