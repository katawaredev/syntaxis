[package]
name = "syntaxis-git-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.92"
syntaxis-git = { path = "../git" }
syntaxis-workspace = { path = "../workspace" }
syntaxis-workspace-host = { path = "../workspace-host" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
zeroize = "1.9.1"
uuid = { version = "1.29.2", features = ["v5"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
