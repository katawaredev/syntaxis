[package]
name = "syntaxis-runtime-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "ws"], optional = true }
base64 = "0.23.1"
bytes = "1.12.1"
dioxus = { version = "0.7.10", features = ["fullstack"] }
futures = "0.3.34"
futures-util = "0.3.34"
manganis = "0.7.10"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.4", optional = true }
syntaxis-agent = { path = "../agent" }
syntaxis-agent-host = { path = "../agent-host", optional = true }
syntaxis-app-contracts = { path = "../app-contracts" }
syntaxis-app-shell = { path = "../app-shell" }
syntaxis-editor = { path = "../editor" }
syntaxis-git = { path = "../git" }
syntaxis-git-host = { path = "../git-host", optional = true }
syntaxis-lsp-host = { path = "../lsp-host", optional = true }
syntaxis-module-ai = { path = "../module-ai" }
syntaxis-module-files = { path = "../module-files" }
syntaxis-module-git = { path = "../module-git" }
syntaxis-module-preview = { path = "../module-preview" }
syntaxis-module-terminal = { path = "../module-terminal" }
syntaxis-notifications = { path = "../notifications" }
syntaxis-notifications-host = { path = "../notifications-host", optional = true }
syntaxis-terminal = { path = "../terminal" }
syntaxis-terminal-host = { path = "../terminal-host", optional = true }
syntaxis-workspace = { path = "../workspace" }
syntaxis-workspace-host = { path = "../workspace-host", optional = true }
url = "2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
], optional = true }
subtle = { version = "2.6.1", optional = true }
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
], optional = true }
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-webpki-roots",
], optional = true }
tokio-util = { version = "0.7.19", features = ["rt"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.104"
web-sys = { version = "0.3.104", features = ["Blob", "BlobPropertyBag", "Url"] }

[features]
host = ["dep:syntaxis-workspace-host", "dep:tokio"]
server = [
  "dioxus/server",
  "dep:axum",
  "dep:rand_core",
  "dep:reqwest",
  "dep:subtle",
  "dep:syntaxis-agent-host",
  "dep:syntaxis-git-host",
  "dep:syntaxis-lsp-host",
  "dep:syntaxis-notifications-host",
  "dep:syntaxis-terminal-host",
  "dep:syntaxis-workspace-host",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:tokio-util",
  "dep:toml",
]

[dev-dependencies]
futures-lite = "2.6.1"
syntaxis-workspace-host = { path = "../workspace-host" }
tempfile = "3.27.0"

[lints]
workspace = true
