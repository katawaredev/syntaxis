[package]
name = "syntaxis-runtime-browser"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.92"
dioxus = { version = "0.7.10" }
serde = { version = "1.0.229", features = ["derive"] }
syntaxis-app-contracts = { path = "../app-contracts" }
syntaxis-app-shell = { path = "../app-shell" }
syntaxis-module-files = { path = "../module-files" }
syntaxis-module-git = { path = "../module-git" }
syntaxis-module-terminal = { path = "../module-terminal" }
syntaxis-git = { path = "../git" }
syntaxis-workspace = { path = "../workspace" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1.0.151"
syntaxis-workspace-browser = { path = "../workspace-browser" }
syntaxis-terminal-browser = { path = "../terminal-browser" }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = [
  "Clipboard",
  "Navigator",
  "Storage",
  "Window",
] }

[dev-dependencies]
futures-lite = "2.6.1"

[lints]
workspace = true
