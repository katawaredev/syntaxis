services:
  syntaxis:
    build:
      context: .
      target: production
    image: "${SYNTAXIS_IMAGE:-ghcr.io/katawaredev/syntaxis:latest}"
    container_name: syntaxis
    hostname: syntaxis
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOME: /home/dev
      SHELL: /bin/bash
      IP: 0.0.0.0
      PORT: 8080
      SYNTAXIS_PROJECTS_ROOT: /Projects
      SYNTAXIS_PASSWORD_HASH: "${SYNTAXIS_PASSWORD_HASH:?Set SYNTAXIS_PASSWORD_HASH; see README.md}"
      SYNTAXIS_API_TOKEN: "${SYNTAXIS_API_TOKEN:-}"
      SYNTAXIS_PREVIEW_ORIGIN: "${SYNTAXIS_PREVIEW_ORIGIN:-}"
      VERCEL_OIDC_TOKEN: "${VERCEL_OIDC_TOKEN:-}"
    ports:
      - "${SYNTAXIS_BIND:-127.0.0.1}:${SYNTAXIS_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${DATA:-./data}/syntaxis/home:/home/dev"
      - "${HOST_HOME:-${HOME}}/.ssh:/home/dev/.ssh:ro"
      - "${HOST_HOME:-${HOME}}/.gnupg:/home/dev/.gnupg"
      - "${HOST_PROJECTS:-${HOME}/Projects}:/Projects"
    working_dir: /Projects
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
