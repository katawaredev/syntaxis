name: Publish Android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version (without v)
        required: true
        type: string
      ref:
        description: Commit or tag for that release
        required: true
        type: string

concurrency:
  group: publish-android-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Verify release version and signing configuration
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 apps/Android/verify-release.py "$EXPECTED_VERSION"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/syntaxis.jks"
      - name: Build and check signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/syntaxis.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apps/Android/gradlew -p apps/Android :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --console=plain
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose apps/Android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp apps/Android/app/build/outputs/apk/release/app-release.apk dist/syntaxis.apk
          cp apps/Android/termux/install.sh dist/install-syntaxis.sh
          cp apps/Android/README.md dist/Android-README.md
          python3 apps/Android/termux/test-install.py
          python3 apps/Android/termux/test-start.py
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/syntaxis.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python3 apps/Android/verify-release.py "$EXPECTED_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'ndk;28.2.13676358'
      - uses: cargo-bins/cargo-binstall@main
        with:
          version: '1.21.1'
      - run: cargo binstall --no-confirm --locked dioxus-cli@0.7.10
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Build matching Android server and frontend
        env:
          ABI: ${{ matrix.abi }}
          CARGO_BUILD_JOBS: '2'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash apps/Android/termux/build-backend.sh "$ABI"
      - uses: actions/upload-artifact@v4
        with:
          name: android-backend-${{ matrix.abi }}
          path: |
            target/syntaxis-termux-${{ matrix.abi }}.tar.gz
            target/syntaxis-termux-${{ matrix.abi }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [apk, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: android-*
          merge-multiple: true
          path: dist
      - name: Attach packages to the matching existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 apps/Android/verify-release.py "$VERSION"
          tag="v$VERSION"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")"
          cd dist
          sha256sum -c syntaxis-termux-arm64-v8a.tar.gz.sha256
          sha256sum -c syntaxis-termux-armeabi-v7a.tar.gz.sha256
          sha256sum syntaxis.apk install-syntaxis.sh syntaxis-termux-*.tar.gz > Android-SHA256SUMS
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber -- ./*
