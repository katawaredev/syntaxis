name: Publish container

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        type: string
      ref:
        description: Git commit or tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to republish
        required: true
        type: string
      ref:
        description: Git commit or tag to republish
        required: true
        type: string

concurrency:
  group: publish-container-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/katawaredev/syntaxis

jobs:
  publish:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify package version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          actual="$(
            python3 -c 'import tomllib; print(tomllib.load(open("apps/main/Cargo.toml", "rb"))["package"]["version"])'
          )"
          if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "apps/main/Cargo.toml version $actual does not match requested version $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/katawaredev/syntaxis
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
