name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CC_wasm32_unknown_unknown: clang

jobs:
  validate:
    name: ${{ github.event_name == 'pull_request' && 'Pull request' || 'Manual full validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-and-server

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
        with:
          version: "1.21.0"

      - name: Install validation tools
        run: |
          cargo binstall --no-confirm --locked \
            just@1.57.0 \
            dioxus-cli@0.7.9 \
            cargo-nextest@0.9.140

      - name: Install full-audit tools
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo binstall --no-confirm --locked \
            cargo-deny@0.20.2 \
            cargo-machete@0.9.2

      - name: Verify native build tools
        run: |
          cc --version
          clang --version

      - name: Validate web and server
        if: github.event_name == 'pull_request'
        run: |
          just check web
          just check server

      - name: Run manually requested full validation
        if: github.event_name == 'workflow_dispatch'
        run: |
          just ci web
          just check server

      - name: Verify tracked generated files are current
        run: git diff --exit-code
